{% extends "base.html" %}

{% block title %}Pengaturan{% endblock %}

{% block content %}
<h2>Pengaturan</h2>

<div class="row">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-header">Payment Gateway (Paymenku)</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Merchant ID</label>
                        <input type="text" name="merchant_id" class="form-control" value="{{ merchant_id }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">API Key</label>
                        <input type="text" name="api_key" class="form-control" value="{{ api_key }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Callback URL</label>
                        <input type="text" class="form-control" value="{{ request.url_root }}api/callback" readonly>
                    </div>
                    <button type="submit" class="btn btn-primary">Simpan Pengaturan</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-header">Keamanan Admin</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin_change_password') }}">
                    <div class="mb-3">
                        <label class="form-label">Password Admin Baru</label>
                        <input type="password" name="new_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-danger">Ganti Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
