{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block content %}
<h2>Settings</h2>
<div class="card mt-4">
    <div class="card-header">Payment Gateway (Paymenku)</div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Merchant ID</label>
                <input type="text" name="merchant_id" class="form-control" value="{{ merchant_id }}">
            </div>
            <div class="mb-3">
                <label class="form-label">API Key</label>
                <input type="text" name="api_key" class="form-control" value="{{ api_key }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Callback URL (Read-only)</label>
                <input type="text" class="form-control" value="{{ request.url_root }}api/callback" readonly>
                <small class="text-muted">Copy this URL to your Paymenku Merchant Dashboard.</small>
            </div>
            <button type="submit" class="btn btn-primary">Save Settings</button>
        </form>
    </div>
</div>
{% endblock %}
