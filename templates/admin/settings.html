{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block content %}
<h2>Settings</h2>

<div class="row">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-header">Payment Gateway (Paymenku)</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Merchant ID</label>
                        <input type="text" name="merchant_id" class="form-control" value="{{ merchant_id }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">API Key</label>
                        <input type="text" name="api_key" class="form-control" value="{{ api_key }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Callback URL</label>
                        <input type="text" class="form-control" value="{{ request.url_root }}api/callback" readonly>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-header">Admin Security</div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('admin_change_password') }}">
                    <div class="mb-3">
                        <label class="form-label">New Admin Password</label>
                        <input type="password" name="new_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-danger">Change Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
